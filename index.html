<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-tool</title>
  <meta name="description" content="my-tool は、毎日の作業をシンプルにする小さなツールです。">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f6f8;
      --text: #1d2330;
      --muted: #5b6475;
      --accent: #2f6bff;
      --accent-text: #ffffff;
      --border: #e3e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11141a;
        --surface: #1a1f28;
        --text: #e9edf3;
        --muted: #9aa3b2;
        --accent: #5b8cff;
        --border: #2a303b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    a { color: inherit; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 16px; }

    header {
      border-bottom: 1px solid var(--border);
    }
    header .container {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .logo { font-weight: 700; font-size: 1.2rem; text-decoration: none; }
    nav a { margin-left: 20px; text-decoration: none; color: var(--muted); font-size: 0.95rem; }
    nav a:hover { color: var(--text); }

    .hero { padding: 96px 0 80px; text-align: center; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.3; margin-bottom: 16px; }
    .hero p { color: var(--muted); font-size: 1.1rem; max-width: 560px; margin: 0 auto 32px; }
    .btn {
      display: inline-block; padding: 12px 28px; border-radius: 8px;
      background: var(--accent); color: var(--accent-text);
      text-decoration: none; font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    .btn-outline {
      background: transparent; color: var(--text);
      border: 1px solid var(--border); margin-left: 8px;
    }

    section { padding: 64px 0; }
    section h2 { font-size: 1.6rem; text-align: center; margin-bottom: 40px; }
    .features {
      display: grid; gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px;
    }
    .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 0.95rem; }

    .cta { background: var(--surface); text-align: center; }
    .cta p { color: var(--muted); margin-bottom: 24px; }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0; text-align: center;
      color: var(--muted); font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      nav { display: none; }
      .btn-outline { margin: 12px 0 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="#" class="logo">my-tool</a>
      <nav>
        <a href="#features">特徴</a>
        <a href="#start">はじめる</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="hero container">
      <h1>毎日の作業を、<br>もっとシンプルに。</h1>
      <p>my-tool は、面倒な繰り返し作業をまとめて片づける小さなツールです。</p>
      <a href="#start" class="btn">今すぐはじめる</a>
      <a href="#features" class="btn btn-outline">詳しく見る</a>
    </div>

    <section id="features">
      <div class="container">
        <h2>特徴</h2>
        <div class="features">
          <div class="card">
            <h3>かんたん</h3>
            <p>難しい設定は不要。インストールしてすぐに使えます。</p>
          </div>
          <div class="card">
            <h3>すばやい</h3>
            <p>軽量な設計で、待ち時間なくサクサク動きます。</p>
          </div>
          <div class="card">
            <h3>安心</h3>
            <p>データは手元で処理。外部に送られることはありません。</p>
          </div>
        </div>
      </div>
    </section>

    <section id="start" class="cta">
      <div class="container">
        <h2>さっそく使ってみましょう</h2>
        <p>GitHub からソースコードを入手できます。</p>
        <a href="https://github.com/iototoooo/my-tool" class="btn">GitHub で見る</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">&copy; 2026 my-tool</div>
  </footer>
</body>
</html>
